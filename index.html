<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício boas práticas de CSS</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="produtos">
        <div class="produto">
            <img class="produto__imagem" src="https://leonora.vteximg.com.br/arquivos/ids/164620-1000-1000/fone_de_ouvido_sem_fio_ocean_preto_plastico_reciclado_bluetooth_5_3_7h_de_bateria_skim_letron_94422_3.png?v=638239822993600000" alt="Fone de Ouvido">
            <h4 class="produto__nome">Fone de Ouvido Sem Fio</h4>
            <p class="produto__descricao">
                Fone de ouvido Bluetooth com cancelamento de ruído.
            </p>
        </div>
        <div class="produto produto--destaque">
            <img class="produto__imagem" src="https://qcybrasil.com/cdn/shop/files/Relogio_Smartwatch_QCY_GTR_S4_Preto_2.png?v=1723057724" alt="Smartwatch">
            <h4 class="produto__nome">Smartwatch Inteligente</h4>
            <p class="produto__descricao">
                Smartwatch com monitor de frequência cardíaca e GPS integrado.
            </p>
        </div>
        <div class="produto">
            <img class="produto__imagem" src="https://s2-techtudo.glbimg.com/yn8aMx3lSwvm-9xzOzbrnzPNEbw=/0x0:695x591/984x0/smart/filters:strip_icc()/i.s3.glbimg.com/v1/AUTH_08fbf48bc0524877943fe86e43087e7a/internal_photos/bs/2021/K/v/JvstErSIGCLFQYLSIjRw/2016-11-18-d4s-black-bodyonly.png" alt="Câmera DSLR">
            <h4 class="produto__nome">Câmera DSLR Profissional</h4>
            <p class="produto__descricao">
                Câmera com lente intercambiável e gravação em 4K.
            </p>
        </div>
    </div>
</body>
</html>
